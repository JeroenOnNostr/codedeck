[package]
name = "codedeck"
# Cargo requires strict 3-part semver (no leading zeros, no 4th component), so the crate uses the
# unpadded date. The user-facing version (package.json, tauri.conf.json, Android versionName,
# GitHub/Zapstore releases) is the zero-padded 2026.06.17 — keep these in lockstep on each release.
version = "2026.7.28"
description = "CodeDeck - Multi-session AI coding agent"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "codedeck_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
anyhow = "1"
walkdir = "2"
regex = "1"
futures-util = "0.3"
tokio-stream = "0.1"
globset = "0.4"
async-trait = "0.1"
tauri-plugin-stronghold = "2"
tauri-plugin-store = "2"
tauri-plugin-speech-recognizer = { path = "../tauri-plugin-speech-recognizer" }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-background-relay = { path = "../tauri-plugin-background-relay" }
tauri-plugin-http = "2"
tauri-plugin-tts = "0.1"
# Embedded nostr-vpn FIPS mesh as CodeDeck's own Android VpnService (one app on the phone).
# The mesh engine (nostr-vpn-app-core) is NOT a direct dep of this crate — it is cross-compiled
# for arm64 and packaged by tauri-plugin-mesh's gradle cargo-ndk task, then loaded via JNI.
tauri-plugin-mesh = { path = "../tauri-plugin-mesh" }

[profile.dev.package.scrypt]
opt-level = 3
